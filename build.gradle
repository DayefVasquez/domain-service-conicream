plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.6'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.conicream'
version = '0.1.0-SNAPSHOT'
description = 'Domain service de Coni Cream Al-Paso: productos, inventario, pedidos, liquidación y reporte Excel - arquitectura hexagonal'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    mavenCentral()
}

ext {
    jjwtVersion = '0.12.6'
    archunitVersion = '1.4.1'   // Soporte nativo para bytecode de Java 25
    poiVersion = '5.3.0'
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'

    // Verificación del JWT que emite AuthCore
    implementation "io.jsonwebtoken:jjwt-api:${jjwtVersion}"
    runtimeOnly "io.jsonwebtoken:jjwt-impl:${jjwtVersion}"
    runtimeOnly "io.jsonwebtoken:jjwt-jackson:${jjwtVersion}"

    // Reporte oficial en Excel (FEAT-12)
    implementation "org.apache.poi:poi-ooxml:${poiVersion}"

    // Persistencia oficial en producción (PostgreSQL)
    runtimeOnly 'org.postgresql:postgresql'

    // H2 para pruebas unitarias herméticas sin levantar BD externa
    testRuntimeOnly 'com.h2database:h2'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testImplementation "com.tngtech.archunit:archunit-junit5:${archunitVersion}"
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs << '-Xlint:all,-serial,-processing'
}

tasks.named('test') {
    useJUnitPlatform()
}
