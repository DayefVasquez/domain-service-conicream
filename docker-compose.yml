version: "3.8"

services:
  core-db:
    image: postgres:17-alpine
    container_name: core-postgres-db
    environment:
      POSTGRES_DB: core_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5434:5432"
    volumes:
      # Solo montaje de scripts en modo lectura (CERO volúmenes persistentes de datos)
      - ./init-db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d core_db"]
      interval: 3s
      timeout: 3s
      retries: 5

  domain-service:
    build: .
    container_name: domain-service
    depends_on:
      core-db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://core-db:5432/core_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      JWT_SECRET_BASE64: lD6FtWWWLBqHzm7osQiel+C6RJqgGeqBzVpQ7bmGoyM=
    ports:
      - "8082:8082"
