# Perfil "prod": MySQL 8.4 (la base declarada por el grupo). Se activa con SPRING_PROFILES_ACTIVE=prod.
spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/conicream}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update   # mejora pendiente: reemplazar por migraciones Flyway
